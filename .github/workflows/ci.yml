name: Phase 3 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: pause_test
          POSTGRES_USER: pause
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pause -d pause_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pause:ci-disposable-only@127.0.0.1:5432/pause_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go test -race ./internal/... -count=1
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: go test ./... && go vet ./...
        working-directory: scripts/paypal-spike
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  inference-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ml/src
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.lock.txt
      - run: python -m pip install -r ml/requirements.lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      # Weights/caches are deliberately absent from Git. Build a disposable
      # development release without regenerating splits or opening final tests.
      - run: python -B -m pause_ml.train
      - run: python -B -m pause_ml.runtime
      - run: python -B -m unittest discover -s ml/tests -v
