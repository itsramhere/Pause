name: Product checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: pause_test
          POSTGRES_USER: pause
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pause -d pause_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pause:ci-disposable-only@127.0.0.1:5432/pause_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go test -race ./internal/... -count=1
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: go test ./... && go vet ./...
        working-directory: scripts/paypal-spike
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: pause_test
          POSTGRES_USER: pause
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pause -d pause_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npx playwright install --with-deps chromium
      - run: go test ./internal/httpapi -run 'TestP(05BrowserJourneys|06CheckoutApprovalRecovery)$' -count=1 -v
        working-directory: .
        env:
          P05_BROWSER: '1'
          TEST_DATABASE_URL: postgres://pause:ci-disposable-only@127.0.0.1:5432/pause_test?sslmode=disable
  inference-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: pause_test
          POSTGRES_USER: pause
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pause -d pause_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.ml.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m -XX:ActiveProcessorCount=2'
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PYTHONPATH: ml/src
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      APP_ENV: test
      DATABASE_URL: postgres://pause:ci-disposable-only@127.0.0.1:5432/pause_test?sslmode=disable
      TEST_DATABASE_URL: postgres://pause:ci-disposable-only@127.0.0.1:5432/pause_test?sslmode=disable
      MESSAGE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      PAYPAL_MERCHANT_ID: CI_SYNTHETIC_MERCHANT
      ML_SERVICE_URL: http://127.0.0.1:8090
      ML_SERVICE_TOKEN: ci-disposable-private-service-token-000000
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.lock.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: python -m pip install --no-deps -r ml/requirements.linux.lock.txt --extra-index-url https://download.pytorch.org/whl/cpu && python -m pip check
      # Weights/caches are deliberately absent from Git. Build a disposable
      # development release without regenerating splits or opening final tests.
      - run: python -B -m pause_ml.train
      - run: python -B -m pause_ml.runtime
      - run: python -B -m unittest discover -s ml/tests -v
      - name: Actual private hybrid retrieval and cleanup
        env:
          P04_LIVE_ELASTIC: '1'
        run: |
          mkdir -p data
          python -B -m pause_ml.service > data/private-inference.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer $ML_SERVICE_TOKEN" "$ML_SERVICE_URL/readyz" > /dev/null; then break; fi
            sleep 1
          done
          go run ./cmd/migrate
          go run ./cmd/investigation-setup
          go test ./internal/app -run P04 -count=1 -v
